<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon X</title>
<style>
  :root {
    --ink: #efe6ff;
    --ink-dim: #b8a6e0;
    --void: #0a0418;
    --glow: #7b2ff7;
    --violet: #9d4dff;
    --deep: #4a1bb5;
    --alert: #ff8fa3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 35%, #2a0a5a, var(--void) 70%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 44px); letter-spacing: 3px; }
  #go {
    padding: 14px 44px; font-size: 18px; font-weight: 700; color: #fff;
    border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(90deg, var(--violet), var(--deep));
    box-shadow: 0 0 24px var(--glow);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #go:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 34px var(--glow); }
  #go:disabled { opacity: .6; cursor: progress; }
  button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  #site {
    padding: 10px 32px; font-size: 15px; font-weight: 600; color: var(--ink);
    border: 1px solid var(--violet); border-radius: 10px; cursor: pointer; background: transparent;
  }
  #site:hover { background: #ffffff14; }

  .bar { width: min(360px, 80vw); height: 6px; border-radius: 3px; background: #ffffff1a; overflow: hidden; }
  .bar[hidden] { display: none; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--violet), #d6b8ff); transition: width .2s linear; }

  #msg { margin: 0; min-height: 1.4em; color: var(--ink-dim); }
  #msg.error { color: var(--alert); }

  #open {
    color: #fff; font-weight: 600; text-decoration: underline; text-underline-offset: 4px;
  }
  #open[hidden] { display: none; }

  .tools { display: flex; gap: 18px; margin-top: 10px; }
  .tools button {
    background: none; border: 0; padding: 4px; cursor: pointer;
    color: var(--ink-dim); font: inherit; font-size: 14px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .tools button:hover { color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    #go, #fill { transition: none; }
  }
</style>
</head>
<body>
  <h1>&#9670; DRAGON X</h1>
  <button id="go" type="button">Launch client</button>
  <button id="site" type="button">Game site</button>
  <div class="bar" id="bar" hidden><div id="fill"></div></div>
  <p id="msg" role="status" aria-live="polite"></p>
  <a id="open" href="#" target="_blank" rel="noopener" hidden>Open client</a>
  <div class="tools">
    <button id="update" type="button">Download latest version</button>
    <button id="clear" type="button">Clear saved copy</button>
  </div>

<script>
  const GAME_URL = 'https://raw.githubusercontent.com/D84UV/Purpleclient/main/index.html';
  // Approximate file size in bytes, used only to draw the progress bar.
  // Update it if the file in your repo changes size a lot.
  const EXPECTED_BYTES = 19837784;

  const $ = (id) => document.getElementById(id);
  const goBtn = $('go'), msg = $('msg'), bar = $('bar'), fill = $('fill'), openLink = $('open');
  let currentUrl = null;

  /* ---------- saved copy (IndexedDB, fails quietly if blocked) ---------- */
  const DB = 'dragonx-launcher', STORE = 'files', KEY = 'client';

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbRun(mode, fn) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, mode);
      const req = fn(tx.objectStore(STORE));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    });
  }
  const loadSaved  = async () => { try { return await dbRun('readonly',  s => s.get(KEY)) || null; } catch { return null; } };
  const saveCopy   = async (blob) => { try { await dbRun('readwrite', s => s.put({ blob, savedAt: Date.now() }, KEY)); return true; } catch { return false; } };
  const clearSaved = async () => { try { await dbRun('readwrite', s => s.delete(KEY)); return true; } catch { return false; } };

  /* ---------- helpers ---------- */
  function say(text, isError = false) {
    msg.textContent = text;
    msg.classList.toggle('error', isError);
  }
  function setBusy(busy) {
    goBtn.disabled = busy;
    $('update').disabled = busy;
    $('clear').disabled = busy;
  }
  function showProgress(loaded) {
    const pct = Math.min(99, Math.round((loaded / EXPECTED_BYTES) * 100));
    fill.style.width = pct + '%';
    say('Downloading client: ' + (loaded / 1048576).toFixed(1) + ' MB (' + pct + '%)');
  }

  async function download() {
    const res = await fetch(GAME_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('GitHub answered with HTTP ' + res.status + '. Check that the repo is public and the file path is correct.');
    if (!res.body) return await res.blob();

    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    bar.hidden = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      showProgress(loaded);
    }
    fill.style.width = '100%';
    return new Blob(chunks, { type: 'text/html' });
  }

  const PLACEHOLDER =
    '<title>Dragon X</title><body style="margin:0;height:100vh;display:grid;place-items:center;' +
    'background:#0a0418;color:#efe6ff;font-family:system-ui,sans-serif">Loading Dragon X...</body>';

  /* ---------- launch ---------- */
  async function launch(forceFresh) {
    // Open the tab right away, while the click still counts, so the browser doesn't block it.
    let win = null;
    try {
      win = window.open('', '_blank');
      if (win) win.document.write(PLACEHOLDER);
    } catch { /* placeholder is optional */ }

    setBusy(true);
    openLink.hidden = true;
    bar.hidden = true;
    fill.style.width = '0';

    try {
      let blob = null;

      if (!forceFresh) {
        const saved = await loadSaved();
        if (saved && saved.blob) {
          blob = saved.blob;
          say('Using saved copy from ' + new Date(saved.savedAt).toLocaleDateString() + '.');
        }
      }

      if (!blob) {
        blob = await download();
        const stored = await saveCopy(blob);
        if (!stored) say('Downloaded. This browser would not keep a saved copy, so the next launch downloads again.');
      }

      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);
      openLink.href = currentUrl;

      if (win && !win.closed) {
        win.location.href = currentUrl;
        say('Client opened in a new tab.');
      } else {
        // Pop-up was blocked or closed: a fresh click on this link always works.
        openLink.hidden = false;
        say('Ready. Your browser blocked the new tab, so use the link below.');
      }
    } catch (e) {
      try { if (win) win.close(); } catch {}
      say('Could not load the client: ' + e.message + ' Check your connection, then try again.', true);
    } finally {
      bar.hidden = true;
      setBusy(false);
    }
  }

  // Game site: the site's own page code, embedded so it opens straight from this launcher.
  const SITE_HTML = "\n<!DOCTYPE html>\n<html lang=\"en\">\n  <head>\n    <base target=\"_top\">\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n    <meta name=\"theme-color\" content=\"#070b14\">\n    <title>classroom.google.com<\/title>\n    <link rel=\"icon\" type=\"image/png\" href=\"https://ssl.gstatic.com/classroom/favicon.png\">\n    <style>\n      :root {\n        color-scheme:dark;\n        --bg:#070b14;\n        --bg-soft:#0b1120;\n        --surface:#111827;\n        --surface-strong:#182235;\n        --surface-hover:#1d2940;\n        --text:#f8fafc;\n        --muted:#94a3b8;\n        --accent:#7c5cff;\n        --accent-2:#22d3ee;\n        --accent-text:#ffffff;\n        --border:rgba(148,163,184,.18);\n        --border-strong:rgba(148,163,184,.32);\n        --success:#4ade80;\n        --warning:#fbbf24;\n        --danger:#fb7185;\n        --shadow:0 18px 55px rgba(0,0,0,.36);\n        --glow:rgba(124,92,255,.20);\n      }\n\n      body[data-theme=\"purple\"] {\n        --bg:#120a24;\n        --bg-soft:#1a0f34;\n        --surface:#241642;\n        --surface-strong:#302057;\n        --surface-hover:#3a2865;\n        --accent:#b15cff;\n        --accent-2:#f472b6;\n        --border:rgba(216,180,254,.18);\n        --border-strong:rgba(216,180,254,.34);\n        --glow:rgba(177,92,255,.24);\n      }\n\n      body[data-theme=\"ocean\"] {\n        --bg:#04141c;\n        --bg-soft:#071f2a;\n        --surface:#0b2a36;\n        --surface-strong:#103846;\n        --surface-hover:#164858;\n        --accent:#06b6d4;\n        --accent-2:#38bdf8;\n        --border:rgba(103,232,249,.17);\n        --border-strong:rgba(103,232,249,.34);\n        --glow:rgba(6,182,212,.22);\n      }\n\n      body[data-theme=\"emerald\"] {\n        --bg:#04140c;\n        --bg-soft:#082016;\n        --surface:#0d2d20;\n        --surface-strong:#123d2a;\n        --surface-hover:#194d36;\n        --accent:#22c55e;\n        --accent-2:#5eead4;\n        --border:rgba(110,231,183,.17);\n        --border-strong:rgba(110,231,183,.34);\n        --glow:rgba(34,197,94,.20);\n      }\n\n      * { box-sizing:border-box; }\n      html { min-height:100%; background:var(--bg); }\n      body {\n        min-height:100vh;\n        margin:0;\n        color:var(--text);\n        background:\n          radial-gradient(circle at 12% -10%,var(--glow),transparent 34rem),\n          radial-gradient(circle at 88% 0,rgba(34,211,238,.09),transparent 30rem),\n          linear-gradient(180deg,var(--bg-soft),var(--bg));\n        font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif;\n        transition:background .22s ease,color .22s ease;\n      }\n\n      button,input,select { font:inherit; }\n      button,select { -webkit-tap-highlight-color:transparent; }\n      a { color:inherit; }\n      .site-shell { width:min(1480px,100%); margin:0 auto; padding:24px clamp(14px,3vw,34px) 42px; }\n\n      .site-header {\n        position:relative;\n        overflow:hidden;\n        padding:clamp(20px,4vw,38px);\n        border:1px solid var(--border);\n        border-radius:24px;\n        background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),var(--surface);\n        box-shadow:var(--shadow);\n      }\n      .site-header::after {\n        content:\"\";\n        position:absolute;\n        width:260px;\n        height:260px;\n        right:-90px;\n        top:-135px;\n        border-radius:50%;\n        background:radial-gradient(circle,var(--glow),transparent 68%);\n        pointer-events:none;\n      }\n      .brand-row { position:relative; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:28px; }\n      .brand { display:flex; min-width:0; align-items:flex-start; gap:16px; }\n      .brand-mark {\n        display:grid;\n        place-items:center;\n        flex:0 0 58px;\n        width:58px;\n        height:58px;\n        border:1px solid color-mix(in srgb,var(--accent) 65%,white 10%);\n        border-radius:17px;\n        background:var(--accent);\n        background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 52%,#020617));\n        color:#fff;\n        font-size:23px;\n        font-weight:900;\n        letter-spacing:-1px;\n        box-shadow:0 12px 28px var(--glow);\n      }\n      .eyebrow { margin:1px 0 5px; color:var(--accent-2); font-size:12px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }\n      .brand-copy h1 { margin:0; color:var(--text); font-size:clamp(28px,5vw,50px); line-height:1.02; letter-spacing:-.045em; }\n      .brand-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-top:13px; color:var(--muted); font-size:14px; }\n      .contact-link {\n        display:inline-flex;\n        align-items:center;\n        gap:7px;\n        color:var(--text);\n        font-weight:750;\n        text-decoration:none;\n      }\n      .contact-link:hover { color:var(--accent-2); }\n      .contact-dot { width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:0 0 0 4px rgba(74,222,128,.12); }\n      .meta-divider { width:1px; height:15px; background:var(--border-strong); }\n      .header-actions { display:flex; flex:0 0 auto; align-items:center; gap:10px; }\n      .theme-control {\n        display:flex;\n        align-items:center;\n        gap:8px;\n        padding:8px 10px 8px 13px;\n        border:1px solid var(--border);\n        border-radius:12px;\n        background:rgba(0,0,0,.16);\n        color:var(--muted);\n        font-size:13px;\n        font-weight:700;\n      }\n      .theme-control select {\n        min-width:92px;\n        padding:7px 28px 7px 9px;\n        border:1px solid var(--border);\n        border-radius:9px;\n        outline:none;\n        background:var(--surface-strong);\n        color:var(--text);\n        cursor:pointer;\n      }\n      .updated-badge {\n        padding:10px 12px;\n        border:1px solid var(--border);\n        border-radius:12px;\n        background:rgba(0,0,0,.16);\n        color:var(--muted);\n        font-size:12px;\n        font-weight:750;\n        white-space:nowrap;\n      }\n      .header-note { position:relative; z-index:1; max-width:780px; margin:20px 0 0 74px; color:var(--muted); font-size:14px; line-height:1.65; }\n\n      .ad-panel {\n        margin-top:18px;\n        padding:12px;\n        border:1px solid var(--border);\n        border-radius:18px;\n        background:rgba(255,255,255,.025);\n      }\n      .ad-label { margin:0 0 8px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.14em; text-align:center; text-transform:uppercase; }\n      .ad-container { display:flex; justify-content:center; width:100%; overflow:hidden; }\n      .ad-container iframe { display:block; width:min(970px,100%); max-width:100%; height:250px; border:0; }\n\n      .game-browser { margin-top:22px; }\n      .browser-toolbar {\n        display:flex;\n        align-items:center;\n        justify-content:space-between;\n        gap:14px;\n        margin-bottom:14px;\n        padding:14px;\n        border:1px solid var(--border);\n        border-radius:17px;\n        background:var(--surface);\n        background:color-mix(in srgb,var(--surface) 88%,transparent);\n        box-shadow:0 10px 28px rgba(0,0,0,.16);\n      }\n      .browser-heading { min-width:170px; }\n      .browser-heading h2 { margin:0; font-size:20px; letter-spacing:-.025em; }\n      .game-count { margin-top:3px; color:var(--muted); font-size:12px; }\n      .search-wrap { position:relative; width:min(470px,100%); }\n      .search-icon {\n        position:absolute;\n        top:50%;\n        left:14px;\n        transform:translateY(-50%);\n        color:var(--muted);\n        pointer-events:none;\n      }\n      .game-search {\n        width:100%;\n        height:46px;\n        padding:0 44px 0 42px;\n        border:1px solid var(--border);\n        border-radius:13px;\n        outline:none;\n        background:var(--bg-soft);\n        color:var(--text);\n        transition:border-color .18s ease,box-shadow .18s ease;\n      }\n      .game-search::placeholder { color:color-mix(in srgb,var(--muted) 76%,transparent); }\n      .game-search:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--glow); }\n      .clear-search {\n        position:absolute;\n        top:50%;\n        right:8px;\n        width:32px;\n        height:32px;\n        transform:translateY(-50%);\n        border:0;\n        border-radius:9px;\n        background:transparent;\n        color:var(--muted);\n        cursor:pointer;\n      }\n      .clear-search:hover { background:var(--surface-hover); color:var(--text); }\n\n      .game-list {\n        display:grid;\n        grid-template-columns:repeat(auto-fill,minmax(210px,1fr));\n        gap:14px;\n      }\n      .game-card {\n        position:relative;\n        display:flex;\n        min-height:142px;\n        flex-direction:column;\n        justify-content:space-between;\n        gap:15px;\n        padding:17px;\n        overflow:hidden;\n        border:1px solid var(--border);\n        border-radius:17px;\n        background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--surface);\n        box-shadow:0 9px 24px rgba(0,0,0,.18);\n        transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;\n      }\n      .game-card::before {\n        content:\"\";\n        position:absolute;\n        inset:0 auto 0 0;\n        width:3px;\n        background:linear-gradient(180deg,var(--accent),var(--accent-2));\n        opacity:.72;\n      }\n      .game-card:hover {\n        z-index:1;\n        transform:translateY(-3px);\n        border-color:var(--border-strong);\n        background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02)),var(--surface-strong);\n        box-shadow:0 16px 32px rgba(0,0,0,.26),0 0 0 1px var(--glow);\n      }\n      .game-card[hidden] { display:none !important; }\n      .game-card.new-game::after {\n        content:\"NEW\";\n        position:absolute;\n        top:10px;\n        right:10px;\n        padding:4px 7px;\n        border:1px solid color-mix(in srgb,var(--accent-2) 55%,transparent);\n        border-radius:999px;\n        background:var(--surface-strong);\n        background:color-mix(in srgb,var(--accent-2) 14%,var(--surface));\n        color:var(--accent-2);\n        font-size:9px;\n        font-weight:900;\n        letter-spacing:.09em;\n      }\n      .game-card h3 { margin:0; padding-right:4px; color:var(--text); font-size:16px; line-height:1.34; letter-spacing:-.012em; }\n      .game-card.new-game h3 { padding-right:45px; }\n      .game-card button {\n        width:100%;\n        min-height:40px;\n        padding:9px 14px;\n        border:1px solid color-mix(in srgb,var(--accent) 72%,white 9%);\n        border-radius:11px;\n        background:var(--accent);\n        background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 64%,#020617));\n        color:var(--accent-text);\n        box-shadow:0 8px 18px var(--glow);\n        cursor:pointer;\n        font-size:12px;\n        font-weight:900;\n        letter-spacing:.09em;\n        transition:filter .16s ease,transform .16s ease,box-shadow .16s ease;\n      }\n      .game-card button:hover { filter:brightness(1.13); box-shadow:0 11px 24px var(--glow); }\n      .game-card button:active { transform:translateY(1px) scale(.99); }\n      .game-card button:focus-visible,.overlay-content button:focus-visible,.close-btn:focus-visible,.clear-search:focus-visible {\n        outline:3px solid color-mix(in srgb,var(--accent-2) 65%,transparent);\n        outline-offset:2px;\n      }\n      .empty-state {\n        display:none;\n        margin:26px 0;\n        padding:30px;\n        border:1px dashed var(--border-strong);\n        border-rad         doc.close();\n          }\n        } catch (error) {}\n      }\n\n      function showUnavailableFrame() {\n        var frame = replaceGameFrame();\n        var unavailableHtml =\n          '<!doctype html><html><head><meta charset=\"utf-8\"><title>Game unavailable<\/title><\/head>' +\n          '<body style=\"margin:0;background:#111827;color:#f8fafc;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh\">' +\n          '<div style=\"max-width:560px;padding:28px;text-align:center\">' +\n          '<h1 style=\"font-size:22px;margin:0 0 10px\">Game file could not be loaded<\/h1>' +\n          '<p style=\"line-height:1.6;color:#cbd5e1;margin:0\">No readable network or cached copy is available. Return to the toolbar and use Retry / Refresh or Saved Copy.<\/p>' +\n          '<\/div><\/body><\/html>';\n        try {\n          writeHtmlToFrame(frame, unavailableHtml);\n        } catch (error) {}\n      }\n\n      async function loadCurrentGame(forceNetwork) {\n        if (!gameState.url) return;\n        var serial = ++gameState.loadSerial;\n        gameState.record = null;\n        gameState.renderIndex = 0;\n        gameState.renderReady = false;\n        showLoadingFrame();\n        setStatus(forceNetwork ? 'Refreshing the game file\u2026' : 'Checking cache and game source\u2026', '');\n\n        try {\n          var record = await getGameRecord(gameState.url, { forceNetwork: !!forceNetwork });\n          if (serial !== gameState.loadSerial) return;\n          gameState.record = record;\n          renderWithMethod(0, false);\n        } catch (error) {\n          if (serial !== gameState.loadSerial) return;\n          recordDiagnostic('Readable download methods failed', error);\n          gameState.record = null;\n          gameState.renderIndex = 0;\n          showUnavailableFrame();\n          setStatus('Game file could not be downloaded and no saved copy is available.', 'error');\n        }\n      }\n\n      function showOverlay(title, url) {\n        currentFile = url;\n        gameState.title = title || 'Game';\n        gameState.url = url;\n        document.getElementById('gameTitle').textContent = gameState.title;\n        document.getElementById('overlay').style.display = 'flex';\n        document.body.style.overflow = 'hidden';\n        resetDiagnostics();\n        requestPersistentStorage();\n        loadCurrentGame(false);\n      }\n\n      function retryCurrentGame() {\n        if (!gameState.url) return;\n        resetDiagnostics();\n        loadCurrentGame(true);\n      }\n\n      function useNextMethod() {\n        if (!gameState.url) return;\n        if (!gameState.record) {\n          loadCurrentGame(false);\n          return;\n        }\n        var nextIndex = (gameState.renderIndex + 1) % RENDER_METHODS.length;\n        renderWithMethod(nextIndex, false);\n      }\n\n      async function loadCachedVersion() {\n        if (!gameState.url) return;\n        var serial = ++gameState.loadSerial;\n        setStatus('Opening the saved copy\u2026', '');\n        try {\n          var cached = await getCachedRecord(gameState.url);\n          if (serial !== gameState.loadSerial) return;\n          if (!cached) {\n            setStatus('No saved copy exists yet. Use Retry / Refresh while the source is reachable.', 'warn');\n            return;\n          }\n          cached.source = 'manual-cache';\n          gameState.record = cached;\n          renderWithMethod(0, false);\n        } catch (error) {\n          recordDiagnostic('Saved copy could not be opened', error);\n          setStatus('The saved copy could not be opened.', 'error');\n        }\n      }\n\n      function writePopupLoading(popup) {\n        try {\n          popup.document.open();\n          popup.document.write(\n            '<!doctype html><html><body style=\"margin:0;background:#111;color:#fff;font-family:Arial;display:grid;place-items:center;height:100vh\">' +\n            '<div>Loading game\u2026<\/div><\/body><\/html>'\n          );\n          popup.document.close();\n        } catch (error) {}\n      }\n\n      function openGameInNewTab() {\n        if (!gameState.url) return;\n\n        \n\n        var popup = window.open('about:blank', '_blank');\n        if (!popup) {\n          setStatus('The new tab was blocked. Allow pop-ups for this page and try again.', 'error');\n          return;\n        }\n        writePopupLoading(popup);\n\n        var recordPromise = gameState.record\n          ? Promise.resolve(gameState.record)\n          : getGameRecord(gameState.url, { forceNetwork: false });\n\n        recordPromise.then(function(record) {\n          var popupHtml = prepareGameHtml(\n            record,\n            'popup-' + Date.now() + '-' + Math.random().toString(36).slice(2),\n            RENDER_METHODS[2]\n          );\n          popup.document.open();\n          popup.document.write(popupHtml);\n          popup.document.close();\n        }).catch(function(error) {\n          recordDiagnostic('New-tab document write failed', error);\n          try {\n            popup.document.open();\n            popup.document.write(\n              '<!doctype html><html><head><meta charset=\"utf-8\"><title>Game unavailable<\/title><\/head>' +\n              '<body style=\"margin:0;background:#111827;color:#f8fafc;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh\">' +\n              '<div style=\"max-width:560px;padding:28px;text-align:center\"><h1 style=\"font-size:22px\">Game could not be opened<\/h1>' +\n              '<p style=\"color:#cbd5e1;line-height:1.6\">Return to the game library and use Retry / Refresh or Saved Copy.<\/p><\/div>' +\n              '<\/body><\/html>'\n            );\n            popup.document.close();\n          } catch (popupError) {}\n          setStatus('The game could not be prepared for the new tab.', 'error');\n        });\n      }\n\n      function requestGameFullscreen() {\n        var frame = gameState.frame || document.getElementById('gameFrame');\n        if (!frame) return;\n        var request =\n          frame.requestFullscreen ||\n          frame.webkitRequestFullscreen ||\n          frame.msRequestFullscreen;\n\n        if (!request) {\n          setStatus('Iframe fullscreen is unavailable here. Use New Tab instead.', 'warn');\n          return;\n        }\n\n        try {\n          var result = request.call(frame);\n          if (result && result.catch) {\n            result.catch(function(error) {\n              recordDiagnostic('Fullscreen request was rejected', error);\n              setStatus('Fullscreen was blocked by the outer iframe. Use New Tab instead.', 'warn');\n            });\n          }\n        } catch (error) {\n          recordDiagnostic('Fullscreen request failed', error);\n          setStatus('Fullscreen was blocked. Use New Tab instead.', 'warn');\n        }\n      }\n\n      function closeOverlay() {\n        ++gameState.loadSerial;\n        clearRenderTimer();\n        clearSamePagePoll();\n        revokeBlobUrl();\n\n        var frame = document.getElementById('gameFrame');\n        if (frame) {\n          try {\n            frame.srcdoc = '';\n            frame.src = 'about:blank';\n          } catch (error) {}\n        }\n\n        document.getElementById('overlay').style.display = 'none';\n        document.body.style.overflow = '';\n        gameState.frame = frame;\n        gameState.renderReady = false;\n      }\n\n      window.addEventListener('message', function(event) {\n        var data = event.data;\n        if (!data || data.gplusGameBridge !== 1) return;\n        if (!gameState.frame || event.source !== gameState.frame.contentWindow) return;\n        if (data.token !== gameState.renderToken) return;\n\n        if (data.type === 'ready' || data.type === 'heartbeat') {\n          markFrameReady(gameState.renderIndex, data.detail);\n        } else if (data.type === 'resource-error') {\n          recordDiagnostic('A game resource failed to load', makeError('RESOURCE_ERROR', data.detail));\n          setStatus(\n            'The game frame started, but one resource was blocked or missing. Try Alternative Method or Cached Copy.',\n            'warn'\n          );\n        } else if (data.type === 'runtime-error' || data.type === 'promise-error') {\n          recordDiagnostic('The game reported ' + data.type, makeError('GAME_SCRIPT', data.detail));\n        }\n      });\n\n      window.addEventListener('keydown', function(event) {\n        if (event.key === 'Escape' && isOverlayOpen()) {\n          closeOverlay();\n        }\n      });\n\n      window.addEventListener('online', function() {\n        if (isOverlayOpen()) {\n          setStatus('Connection restored. Use Retry / Refresh for a new download.', 'ok');\n        }\n      });\n\n      window.addEventListener('offline', function() {\n        if (isOverlayOpen()) {\n          setStatus('Offline mode detected. The loader will use a saved copy if available.', 'warn');\n        }\n      });\n\n      if (document.readyState === 'loading') {\n        document.addEventListener('DOMContentLoaded', initializeInterface, { once: true });\n      } else {\n        initializeInterface();\n      }\n\n      window.addEventListener('beforeunload', function() {\n        clearRenderTimer();\n        clearSamePagePoll();\n        revokeBlobUrl();\n      });\n    <\/script>\n  <\/body>\n<\/html>\n  ";
  let siteUrl = null;
  $('site').onclick = () => {
    const win = window.open('', '_blank');
    if (siteUrl) URL.revokeObjectURL(siteUrl);
    siteUrl = URL.createObjectURL(new Blob([SITE_HTML], { type: 'text/html' }));
    if (win) {
      win.location.href = siteUrl;
      say('Game site opened in a new tab.');
    } else {
      openLink.href = siteUrl;
      openLink.textContent = 'Open game site';
      openLink.hidden = false;
      say('Your browser blocked the new tab, so use the link below.');
    }
  };

  goBtn.onclick = () => launch(false);
  $('update').onclick = () => launch(true);
  $('clear').onclick = async () => {
    const ok = await clearSaved();
    say(ok ? 'Saved copy cleared. The next launch downloads the client again.' : 'No saved copy to clear.');
  };

  // Show whether a saved copy exists so people know a launch will be instant.
  loadSaved().then(saved => {
    if (saved) say('Saved copy ready. Launch starts instantly.');
  });
</script>
